name: RG3 v03 minimal transport integrity

on:
  push:
    branches: [rg3-stripe-e0-execution-v03]

permissions:
  contents: read

jobs:
  verify-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify chunk hashes and reconstruct frozen minimal ZIP
        shell: bash
        run: |
          set -euo pipefail
          base=execution/rg3-v03
          check() { printf '%s  %s\n' "$1" "$2" | sha256sum -c -; }
          check fc2ad3297847dc9cebe0b46817ad56e9381b0c8a69ea1183a428b144aa358e3f "$base/minimal/00.b64"
          check d5aa004ee01188fd17526d618046e6a6f26d795826f0fd27e150f1335604a95e "$base/minimal/01.b64"
          check 83f59983f1585721a2410a61d5428826b7bb068d7970c6b2081e5aefa4a6d8ae "$base/minimal/02.b64"
          check ca6ea6a2d2ac623c41f055215ad13928642129bd15495286a38fa169629afe5f "$base/minimal/03.b64"
          check a35de10c8732de822f1de679faa8331c08aeeca8d96c290080760607935a5cbd "$base/minimal/04.b64"
          check c4344ff914e3f997f67ed4511354438cc8b5f83d2fc6fc966bfa8c5df8d684c3 "$base/minimal/05.b64"
          check a511525ae03cd0aac8580eaa83c9f060035620ae50167b168946fb41d342a602 "$base/minimal/06.b64"
          check 1a10d25e17fcfaed355204b9587cd94998caa37e250ee6576a206d8a02ff479d "$base/minimal/07.b64"
          check c0e9a660a6ebf4dbc92eed675bfc94144e4e1123a67b73cdd7c85f5afe375c43 "$base/minimal08/00.txt"
          check 9ca154752f5574f15f58fb5a56b602c890f9a0ad48dc3817b2d88bfbd541cd10 "$base/minimal08/01.txt"
          mkdir -p /tmp/rg3
          cat "$base"/minimal/{00,01,02,03,04,05,06,07}.b64 "$base"/minimal08/{00,01}.txt > /tmp/rg3/minimal.b64
          base64 --decode /tmp/rg3/minimal.b64 > /tmp/rg3/minimal.zip
          printf '%s  %s\n' '3baffd98c72c4eb498eef77628e89ec884bd56e911670fca6e8d1e944019c73f' /tmp/rg3/minimal.zip | sha256sum -c -
          unzip -q /tmp/rg3/minimal.zip -d /tmp/rg3/minimal
      - name: Run frozen v0.4 verifier
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/rg3/minimal/rg3_v04_minimal
          test -f "$root/scripts/verify_preprimary.py"
          python "$root/scripts/verify_preprimary.py" "$root"
      - name: Assert provider was never contacted
        run: echo 'PROVIDER_MUTATIONS=0; TRANSPORT_ONLY=1'
