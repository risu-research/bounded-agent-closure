name: RG3 v03 Shadow E0 v0.3.4

on:
  push:
    branches: [rg3-stripe-e0-execution-v03]
    paths:
      - execution/rg3-v03/SHADOW_E0_TRIGGER_V034

permissions:
  contents: read

concurrency:
  group: rg3-v03-shadow-e0-v034
  cancel-in-progress: false

jobs:
  shadow-e0:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact RG3 runtime dependencies
        run: python -m pip install --disable-pip-version-check 'pydantic==2.13.4' 'PyYAML==6.0.3' 'pytest==9.0.2'
      - name: Verify canonical execution blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object execution/rg3-v03/patch_e0_v034.py)" = '0bb9723a702badacc6b0ebb9fd6fd11e08dfc341'
          test "$(git hash-object execution/rg3-v03/shadow_stripe_e0_v034.py)" = 'f1c16cd27b8ce0b400d98270986dcc9793576390'
          test "$(git hash-object execution/rg3-v03/run_shadow_e0_v034.sh)" = '8bf09d8e76d678466779c106111d3b57b944a798'
          python -m py_compile execution/rg3-v03/patch_e0_v034.py execution/rg3-v03/shadow_stripe_e0_v034.py
          bash -n execution/rg3-v03/run_shadow_e0_v034.sh
      - name: Run provider-free full-path shadow qualification
        shell: bash
        run: bash execution/rg3-v03/run_shadow_e0_v034.sh
      - name: Upload sealed shadow qualification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rg3-shadow-e0-v034
          path: /tmp/rg3-shadow-v034-public
          if-no-files-found: error
          retention-days: 30
