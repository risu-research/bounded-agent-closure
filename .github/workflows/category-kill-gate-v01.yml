name: Consequence Category Kill Gate v0.1

on:
  push:
    branches: [consequence-category-kill-gate-v01]
    paths:
      - 'execution/category-kill-gate-v01/**'
      - '.github/workflows/category-kill-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fail-closed gate validation
        run: python execution/category-kill-gate-v01/validate_gate.py
      - name: Seal preprimary gate artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=execution/category-kill-gate-v01
          OUT=/tmp/category-kill-gate-v01
          mkdir -p "$OUT"
          sha256sum \
            "$ROOT/RG3_DISPOSITION.md" \
            "$ROOT/PRELOCK.md" \
            "$ROOT/CORPUS_V0_1.json" \
            "$ROOT/validate_gate.py" > "$OUT/MANIFEST.sha256"
          python - "$OUT/SEAL.json" "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          manifest=Path('/tmp/category-kill-gate-v01/MANIFEST.sha256').read_bytes()
          Path(sys.argv[1]).write_text(json.dumps({
            'gate':'CONSEQUENCE_CATEGORY_KILL_GATE_V0_1',
            'status':'SEALED_PREPRIMARY_PENDING_ARM_EXECUTION',
            'commit':sys.argv[2],
            'manifest_sha256':hashlib.sha256(manifest).hexdigest(),
            'provider_calls':0,
            'provider_mutations':0,
            'primary_evidence_consumed':False,
            'rg3_live_execution_authorized':False
          },sort_keys=True,separators=(',',':')))
          PY
          cat "$OUT/MANIFEST.sha256"
          cat "$OUT/SEAL.json"
      - name: Upload preprimary seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consequence-category-kill-gate-v01-preprimary
          path: /tmp/category-kill-gate-v01
          if-no-files-found: error
          retention-days: 90
