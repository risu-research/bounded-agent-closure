name: Consequence Category Kill Gate v0.1

on:
  push:
    branches: [consequence-category-kill-gate-v01]
    paths:
      - 'execution/category-kill-gate-v01/**'
      - '.github/workflows/category-kill-gate-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Fail-closed gate validation
        run: python execution/category-kill-gate-v01/validate_gate.py
      - name: Generate blind case payload and separate reveal map
        shell: bash
        run: |
          set -euo pipefail
          ROOT=execution/category-kill-gate-v01
          BLIND=/tmp/category-kill-gate-v01-blind
          REVEAL=/tmp/category-kill-gate-v01-reveal
          mkdir -p "$BLIND" "$REVEAL"
          python "$ROOT/make_blind_arm_package.py" \
            "$ROOT/CORPUS_V0_1.json" \
            "$BLIND/ARM_INPUT_V0_1.json" \
            "$REVEAL/REVEAL_MAP_V0_1.json"
          test ! -e "$BLIND/REVEAL_MAP_V0_1.json"
          test ! -e "$REVEAL/ARM_INPUT_V0_1.json"
          python - "$BLIND/ARM_INPUT_V0_1.json" <<'PY'
          from pathlib import Path
          import json,sys
          x=json.loads(Path(sys.argv[1]).read_text())
          assert x['package']=='BLIND_CASE_PAYLOAD_V0_1'
          assert len(x['cases'])==8
          forbidden_keys={'locked_oracle','reason','expected_obligation_families','domain','original_case_id'}
          for case in x['cases']:
              assert not (set(case) & forbidden_keys)
              assert set(case)=={'case_id','nominal_success_artifact','intended_consequence','source'}
          guards=x['contamination_guards']
          assert guards == {
              'project_x_terms_provided':False,
              'oracle_provided':False,
              'domain_labels_provided':False,
              'expected_obligation_families_provided':False,
              'designer_reasoning_provided':False,
              'scoring_rubric_provided':False,
          }
          PY
      - name: Seal preprimary gate artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=execution/category-kill-gate-v01
          OUT=/tmp/category-kill-gate-v01
          mkdir -p "$OUT"
          sha256sum \
            "$ROOT/RG3_DISPOSITION.md" \
            "$ROOT/PRELOCK.md" \
            "$ROOT/PRELOCK_CORRECTION_001.md" \
            "$ROOT/CORPUS_V0_1.json" \
            "$ROOT/SOURCE_AUDIT_V0_1.md" \
            "$ROOT/CLAIM_SURFACE_MATRIX_V0_1.csv" \
            "$ROOT/COMPETITIVE_FRONTIER_V0_1.md" \
            "$ROOT/ZERO_SHOT_COMPILER_CRUCIBLE_V0_1.md" \
            "$ROOT/SOURCE_BOUND_EVIDENCE_PLAN_V0_1.schema.json" \
            "$ROOT/NATIVE_VOCABULARY_PROVENANCE.json" \
            "$ROOT/HOLDOUT_CONTAMINATION_LEDGER_V0_1.md" \
            "$ROOT/ARM_B_STRONG_LLM_PROTOCOL_V0_1.md" \
            "$ROOT/validate_gate.py" \
            "$ROOT/make_blind_arm_package.py" > "$OUT/MANIFEST.sha256"
          python - "$OUT/SEAL.json" "$GITHUB_SHA" /tmp/category-kill-gate-v01-blind/ARM_INPUT_V0_1.json /tmp/category-kill-gate-v01-reveal/REVEAL_MAP_V0_1.json <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          manifest=Path('/tmp/category-kill-gate-v01/MANIFEST.sha256').read_bytes()
          arm=Path(sys.argv[3]).read_bytes(); reveal=Path(sys.argv[4]).read_bytes()
          Path(sys.argv[1]).write_text(json.dumps({
            'gate':'CONSEQUENCE_CATEGORY_KILL_GATE_V0_1',
            'status':'SEALED_PREPRIMARY_PENDING_ARM_EXECUTION',
            'commit':sys.argv[2],
            'manifest_sha256':hashlib.sha256(manifest).hexdigest(),
            'blind_arm_input_sha256':hashlib.sha256(arm).hexdigest(),
            'hidden_reveal_map_sha256':hashlib.sha256(reveal).hexdigest(),
            'blind_and_reveal_artifacts_separated':True,
            'source_audit_cases_qualified':8,
            'claim_surface_rows':8,
            'compiler_crucible_prelocked':True,
            'native_vocabulary_frozen':True,
            'holdout_contamination_ledger_monotonic':True,
            'neutral_llm_baseline_protocol_frozen':True,
            'provider_calls':0,
            'provider_mutations':0,
            'primary_evidence_consumed':False,
            'rg3_live_execution_authorized':False
          },sort_keys=True,separators=(',',':')))
          PY
          cat "$OUT/MANIFEST.sha256"
          cat "$OUT/SEAL.json"
      - name: Upload preprimary seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consequence-category-kill-gate-v01-preprimary
          path: /tmp/category-kill-gate-v01
          if-no-files-found: error
          retention-days: 90
      - name: Upload blind arm input only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consequence-category-kill-gate-v01-arm-input
          path: /tmp/category-kill-gate-v01-blind/ARM_INPUT_V0_1.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload hidden reveal map separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consequence-category-kill-gate-v01-reveal-map
          path: /tmp/category-kill-gate-v01-reveal/REVEAL_MAP_V0_1.json
          if-no-files-found: error
          retention-days: 90
