# diagnostic snapshot: enumerate all E0 transport hashes before provider access
name: RG3 v03 E0 capsule integrity

on:
  push:
    branches: [rg3-stripe-e0-execution-v03]

permissions:
  contents: read

jobs:
  verify-e0-capsule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose every E0 transport piece
        shell: bash
        run: |
          set -u
          base=execution/rg3-v03/e0
          bad=0
          check() {
            exp="$1"; f="$2"; got="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s expected=%s actual=%s\n' "$f" "$exp" "$got"
            if [ "$got" != "$exp" ]; then bad=1; fi
          }
          check d047316e7262cc1c7731ca2b3e3482c05a24647d45561f1d6e758472799087ac "$base/00_00.txt"
          check d703ff04622a4f3f27ca97442aef31cfa9eb31611ea2a31724cd745a79a2f817 "$base/00_01.txt"
          check f646b4c5928a3ab21f3395f583568e88304fbb1b20d0437a43f73c0efe78f15e "$base/00_02.txt"
          check 82ecfcd08fd543db79a7a94eceba5b374a6c281941e8292b87459be8ea2f7269 "$base/01_00.txt"
          check ea364ba986f76f51b0fcf524c1c36b0648e49342dd515c7bf5705ca24a323d0c "$base/01_01.txt"
          check ae33bf588f84b05b5e61f018182840defe862f6e44b54b63ea662d712dbc0f26 "$base/01_02.txt"
          check f28ccf7bdf7714fcb37e1318fb4a976cf9f6aa198e3438972eab2a9033e98093 "$base/02_00.txt"
          check ba709e98e62752f5a24543e95643803c1223a911f4da6cea412c1a806e7e5e77 "$base/02_01.txt"
          check 84060ae84d05cb9e5da8c74c564e5e2b3c9023051a8c029fc340385504322f01 "$base/02_02.txt"
          check 52e873fe72bf4543ef117d40e926e096f68a3b41917b22624a0a0c51b6d7339f "$base/03_00.txt"
          check 716c05a7a40a6d58c81930057b53553899642fcc5f664de8155ebfd78425db02 "$base/03_01.txt"
          check 33b197ac20b6f0d87aaabd33a73b879a5c74efbfbdce3ea777c414ace1f9cd15 "$base/03_02.txt"
          check 8083337121c2858f788e17cecf9a0b8a9596ff28ab479d20329b7c6ce2f443c3 "$base/04_00.txt"
          check 35abb9df1d839c14aedb0b3652b13a4f43fe60ab2f77b30538748ddfb4bd8cc0 "$base/04_01.txt"
          if [ "$bad" -ne 0 ]; then echo 'E0_TRANSPORT_INTEGRITY=FAIL; PROVIDER_MUTATIONS=0'; exit 1; fi
          echo 'E0_TRANSPORT_INTEGRITY=PASS; PROVIDER_MUTATIONS=0'
