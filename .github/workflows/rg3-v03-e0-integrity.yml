name: RG3 v03 E0 capsule integrity

on:
  push:
    branches: [rg3-stripe-e0-execution-v03]

permissions:
  contents: read

jobs:
  verify-e0-capsule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact offline qualification dependencies
        run: python -m pip install --disable-pip-version-check 'pydantic==2.13.4' 'PyYAML==6.0.3' 'pytest==9.0.2'
      - name: Verify E0 transport pieces and reconstruct exact capsule ZIP
        shell: bash
        run: |
          set -euo pipefail
          base=execution/rg3-v03/e0
          check() { printf '%s  %s\n' "$1" "$2" | sha256sum -c -; }
          check d047316e7262cc1c7731ca2b3e3482c05a24647d45561f1d6e758472799087ac "$base/00_00.txt"
          check d703ff04622a4f3f27ca97442aef31cfa9eb31611ea2a31724cd745a79a2f817 "$base/00_01.txt"
          check f646b4c5928a3ab21f3395f583568e88304fbb1b20d0437a43f73c0efe78f15e "$base/00_02.txt"
          check 82ecfcd08fd543db79a7a94eceba5b374a6c281941e8292b87459be8ea2f7269 "$base/01_00.txt"
          check ea364ba986f76f51b0fcf524c1c36b0648e49342dd515c7bf5705ca24a323d0c "$base/01_01.txt"
          check ae33bf588f84b05b5e61f018182840defe862f6e44b54b63ea662d712dbc0f26 "$base/01_02.txt"
          check f28ccf7bdf7714fcb37e1318fb4a976cf9f6aa198e3438972eab2a9033e98093 "$base/02_00.txt"
          check ba709e98e62752f5a24543e95643803c1223a911f4da6cea412c1a806e7e5e77 "$base/02_01.txt"
          check 84060ae84d05cb9e5da8c74c564e5e2b3c9023051a8c029fc340385504322f01 "$base/02_02.txt"
          check 52e873fe72bf4543ef117d40e926e096f68a3b41917b22624a0a0c51b6d7339f "$base/03_00.txt"
          check 716c05a7a40a6d58c81930057b53553899642fcc5f664de8155ebfd78425db02 "$base/03_01.txt"
          check 33b197ac20b6f0d87aaabd33a73b879a5c74efbfbdce3ea777c414ace1f9cd15 "$base/03_02.txt"
          check 8083337121c2858f788e17cecf9a0b8a9596ff28ab479d20329b7c6ce2f443c3 "$base/04_00.txt"
          check 35abb9df1d839c14aedb0b3652b13a4f43fe60ab2f77b30538748ddfb4bd8cc0 "$base/04_01.txt"
          mkdir -p /tmp/rg3-e0
          cat "$base"/{00_00,00_01,00_02,01_00,01_01,01_02,02_00,02_01,02_02,03_00,03_01,03_02,04_00,04_01}.txt > /tmp/rg3-e0/e0.b64
          base64 --decode /tmp/rg3-e0/e0.b64 > /tmp/rg3-e0/e0.zip
          printf '%s  %s\n' 'df016b10ae72439a24d5611b6cacee42973d8d25f2a632b65e11eed6691d2495' /tmp/rg3-e0/e0.zip | sha256sum -c -
          unzip -q /tmp/rg3-e0/e0.zip -d /tmp/rg3-e0/capsule
          cap=/tmp/rg3-e0/capsule/rg3_stripe_e0_capsule_v0_3
          (cd "$cap" && sha256sum -c MANIFEST.sha256)
      - name: Reconstruct exact frozen v0.4 minimal substrate
        shell: bash
        run: |
          set -euo pipefail
          base=execution/rg3-v03
          mkdir -p /tmp/rg3-e0/sealed
          cat "$base/minimal/00.b64" "$base/minimal/01.b64" \
              "$base"/minimal02b/{00,01,02}.txt \
              "$base"/minimal03/{00,01}.txt "$base/minimal03c/00.txt" \
              "$base/minimal03d/00.txt" "$base"/minimal03e/{00,01}.txt \
              "$base/minimal/04.b64" "$base/minimal/05.b64" \
              "$base/minimal/06.b64" "$base/minimal/07.b64" \
              "$base"/minimal08/{00,01}.txt > /tmp/rg3-e0/sealed/minimal.b64
          base64 --decode /tmp/rg3-e0/sealed/minimal.b64 > /tmp/rg3-e0/sealed/minimal.zip
          printf '%s  %s\n' '3baffd98c72c4eb498eef77628e89ec884bd56e911670fca6e8d1e944019c73f' /tmp/rg3-e0/sealed/minimal.zip | sha256sum -c -
          unzip -q /tmp/rg3-e0/sealed/minimal.zip -d /tmp/rg3-e0/sealed/root
          python /tmp/rg3-e0/sealed/root/rg3_v04_minimal/scripts/verify_preprimary.py /tmp/rg3-e0/sealed/root/rg3_v04_minimal
      - name: Run E0 v0.3 offline qualification
        shell: bash
        run: |
          set -euo pipefail
          cap=/tmp/rg3-e0/capsule/rg3_stripe_e0_capsule_v0_3
          sealed=/tmp/rg3-e0/sealed/root/rg3_v04_minimal
          (cd "$cap" && pytest -q tests/test_capsule.py)
          env -u STRIPE_SECRET_KEY python "$cap/scripts/stripe_e0.py" preflight --sealed-root "$sealed" --out /tmp/rg3-e0/preflight-evidence
          test -f /tmp/rg3-e0/preflight-evidence/E0_PREFLIGHT.json
          python - <<'PY'
          import json
          p='/tmp/rg3-e0/preflight-evidence/E0_PREFLIGHT.json'
          o=json.load(open(p))
          assert o['phase']=='E0_PREFLIGHT'
          assert o['primary_evidence_consumed'] is False
          assert o['credential_present'] is False
          print('E0_OFFLINE_GATE=PASS; PROVIDER_MUTATIONS=0; PRIMARY_EVIDENCE=0')
          PY
